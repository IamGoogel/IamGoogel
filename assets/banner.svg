<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Animated atom with orbiting electrons" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --wave:#0969da; --line:#d1d9e0; --dim:#8c959f; }
    @media (prefers-color-scheme: dark) {
      :root { --wave:#58a6ff; --line:#3d444d; --dim:#9198a1; }
    }
    .orbit{fill:none;stroke:var(--line);stroke-width:1.2}
    .e{fill:var(--wave)}
    .n{fill:var(--wave)}
    .halo{fill:var(--wave);opacity:.15;animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(1.5);opacity:.05}}
  </style>
  <g transform="translate(450.0,110.0)">
    <g transform="rotate(0)">
      <ellipse class="orbit" rx="105" ry="38"/>
      <circle class="e" r="4.5"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M -105,0 A 105,38 0 1,1 105,0 A 105,38 0 1,1 -105,0"/></circle>
    </g>
    <g transform="rotate(60)">
      <ellipse class="orbit" rx="105" ry="38"/>
      <circle class="e" r="4.5"><animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite" path="M -105,0 A 105,38 0 1,1 105,0 A 105,38 0 1,1 -105,0"/></circle>
    </g>
    <g transform="rotate(120)">
      <ellipse class="orbit" rx="105" ry="38"/>
      <circle class="e" r="4.5"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M -105,0 A 105,38 0 1,1 105,0 A 105,38 0 1,1 -105,0"/></circle>
    </g>
    <circle class="halo" r="12"/>
    <circle class="n" r="6"/>
  </g>
</svg>
